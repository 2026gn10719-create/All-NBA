/* Concept: arena broadcast. A hardwood court banner on top, a jersey-style player card (color follows your school/team) beside one decision panel; key numbers sit on dark scoreboards. */
:root{--bg:#E3E8EF;--panel:#F6F8FB;--panel2:#E9EEF4;--ink:#0D1626;--muted:#5A6678;--line:#C8D0DB;--accent:#E8590C;--accent-ink:#fff;--blue:#1F55C4;--good:#16824A;--bad:#C23B3B;--gold:#9A6B05;--board:#0D1626;--board-ink:#F4F6FA;--led:#FFB020;--wood:#D39A58;--wood2:#B97C3E;--court-line:rgba(255,255,255,.55);--shadow:0 1px 0 rgba(13,22,38,.06),0 8px 24px -12px rgba(13,22,38,.25);

function applyProgress(S,focus,prog){
 const before={...S.d},hb=S.h,notes=[];
 S.age++;if(S.stage==='hs')S.grade++;if(S.stage==='college')S.collegeYear=(S.collegeYear||0)+1;
 potDrift(S,notes);potBreak(S,focus,notes);
 const gt=GT[S.gt]||GT.steady;
 let g=gAt(Math.round(S.age+gt.sh));if(g>0)g*=(S.age<=19?.8:S.age<=25?1.25:1);
 const pf=.55+(S.pot-50)/55,tp=clamp((S.pot+3-ovr(S))/12,.1,1);
 const fm=({camp:2.4,trainer:2.4,study:1.7}[prog])||2.0;
 const F=growthFactors(S,prog);
 let ym=1;
 if(S.gt==='volatile'&&S.age<=27)ym=rnd(.25,1.9);
 else if(S.gt==='explosive'&&S.age<=25)ym=Math.random()<.22?2.4:.55;
 const foc=new Set();(focus||[]).forEach(t=>TR[t]&&TR[t].k.forEach(k=>foc.add(k)));
 const sdev=S.gt==='steady'?.6:.8;
 S.growthF={list:F.list,ym:Math.round(ym*100)/100};
 for(const k of DK){
  const inF=foc.has(k),ph=k==='speed'||k==='jump'||k==='strength';let d;
  if(g>=0){d=g*pf*tp*(inF?fm:.75)*S.apt[k]*F.mult*ym+gauss()*sdev;if(k==='oiq')d+=.4+Math.min(S.seasons.length,6)*.05}
  else{
   const dm=k==='speed'?1.4:k==='jump'?1.3:k==='strength'?.8:k==='oiq'?(S.age>33?.4:0):(k==='three'||k==='mid'||k==='ft')?(S.age>34?.45:.15):k==='steal'||k==='perD'?.7:.35;
   d=g*dm*S.agr*(inF?.6:1)+gauss()*.4;if(k==='oiq'&&S.age<=31)d+=.2}
  if(ph&&prog==='lift')d+=1.5;
  S.d[k]=clamp(Math.round((S.d[k]+d)*10)/10,10,99)}
 if(S.age<=19){S.h+=(HGROW[S.age]||0)*S.hg+rnd(-.2,.3)}
 if(S.pos==='G'&&S.h>=78.5)S.pos='W';else if(S.pos==='W'&&S.h>=83)S.pos='B';
 if(prog==='aau'){S.hype=clamp(S.hype+ri(8,13),0,100);S.d.oiq=clamp(S.d.oiq+1,0,99);S.gpa=clamp(S.gpa-.1,0,4)}
 if(prog==='camp')S.hype=clamp(S.hype+5,0,100);
 if(prog==='lift')S.dur=clamp(S.dur+3,0,99);
 if(prog==='study')S.gpa=clamp(S.gpa+.35,0,4);
 if(prog==='business'){S.hype=clamp(S.hype+6,0,100);S.money+=.4+S.hype/60}
 if(prog==='trainer')S.money-=.3;
 if(S.stage==='college'||S.stage==='hs'){if(prog!=='study')S.gpa=clamp(S.gpa+rnd(-.12,.05),0,4)}
 S.hype=clamp(S.hype-3,0,100);
 S.injuryRisk={aau:.04,lift:-.05,rest:-.08}[prog]||0;
 if(S.injury>0&&prog==='rest')S.injury=0;
 sync(S);
 const st0=S.style;S.style=styleOf(S);if(st0!==S.style)notes.push('플레이 스타일 변화: '+STY[st0].n+' → '+STY[S.style].n);
 updateTraits(S,notes);
 S.progNotes=notes;

 return{before,hb,after:{...S.d},notes}}

 const st=S.stage;
 if(st==='hs')return{level:S.school.level,T:S.team.T,games:ri(24,28),cap:32,mul:1.25,label:'고교 '+S.grade+'학년',scale:'hs'};

 if(st==='pro')return{level:58,T:S.team.T,games:40,cap:32,mul:1.05,label:S.team.name,scale:'pro'};
 return{level:70,T:S.team.T,games:82,cap:38,mul:1.0,label:S.team.name,scale:'nba'}}

function genGame(S,c,o){
 const rel=o-c.level,D=c.D||effD(S),h=S.h,st=STY[S.style||'allround']||STY.allround,SM=st.m,sb=c.sb||subsOf(D);
 let min=24+rel*1.3+gauss()*3;
 if(rel<-18&&Math.random()<.6)min=0;
 min=Math.round(clamp(min,0,c.cap));
 if(min<2)return{min:0,pts:0,reb:0,ast:0,stl:0,blk:0,tov:0,pf:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,fgp:0,tpp:0,dnp:true};
 const k=min/36,gf=1+gauss()*.16,pb=S.pos==='B'?.7:S.pos==='W'?1:1.05;
 /* 슛 선택: 세부 능력치가 클수록 그 구역 시도가 늘어난다 */
 const wIn=Math.pow(D.inside/50,2)*(1+(D.strength+D.jump)/400)*tmul(S,'mixIn')*(SM.mixIn||1)*(S.pos==='B'?1.25:1);
 const wMd=Math.pow(D.mid/50,2)*.85*tmul(S,'mixMid');
 const w3=Math.pow(D.three/50,2.4)*pb*tmul(S,'mix3')*(SM.mix3||1);
 const W=wIn+wMd+w3;
 const skill=(wIn*D.inside+wMd*D.mid+w3*D.three)/W*.7+D.handle*.15+D.oiq*.15;
 const fga36=clamp((5.6+.17*Math.max(0,skill-28)+rel*.11)*c.mul,2.5,28)*tmul(S,'fga')*(SM.usg||1);
 const fga=Math.max(0,Math.round(fga36*k*gf));
 const aIn=fga*wIn/W,aMd=fga*wMd/W,a3=fga*w3/W;
 const drive=.5+sb.dir/200;
 const pIn=clamp(.33+(D.inside-30)*.0033+(D.strength+D.jump-80)*.0005+(drive-.8)*.05+rel*.0015,.34,.74);
 const pMd=clamp(.29+(D.mid-30)*.0033+(sb.pullup-50)*.0004+rel*.0012,.27,.56);
 const p3=clamp(.2+(D.three-30)*.0027+(sb.catchShoot-50)*.0003+tadd(S,'eff3')+rel*.001,.19,.47);
 const bin=(n,p)=>Math.max(0,Math.min(Math.round(n),Math.round(n*p*(1+gauss()*.12))));
 const inM=bin(aIn,pIn),mdM=bin(aMd,pMd),tpm=bin(a3,p3),tpa=Math.round(a3),
  fgm=inM+mdM+tpm,fgaT=Math.round(aIn)+Math.round(aMd)+Math.round(a3);
 const ftp=clamp(.45+(D.ft-30)*.0065,.45,.93);
 const fta=Math.max(0,Math.round(fgaT*clamp(.12+(D.inside-30)*.003+(D.speed-30)*.0012,.06,.5)*tmul(S,'fta')*(1+gauss()*.2)));
 const ftm=Math.max(0,Math.min(fta,Math.round(fta*ftp*(1+gauss()*.08))));
 const pts=2*(fgm-tpm)+3*tpm+ftm;
 const rb36=clamp(-2.8+(D.oreb*.3+D.dreb*.7)*.075+(h-72)*.38+(D.strength+D.jump)*.012+rel*.05,.4,20)*tmul(S,'reb')*(SM.reb||1);
 const orS=clamp(.2+(D.oreb-D.dreb)*.003,.1,.45);
 const oreb=Math.max(0,Math.round(rb36*k*orS*(1+gauss()*.35))),dreb=Math.max(0,Math.round(rb36*k*(1-orS)*(1+gauss()*.3)));
 const ast36=Math.max(.2,-1.6+D.pass*.055+D.handle*.025+D.oiq*.012+rel*.04)*tmul(S,'ast')*(SM.ast||1);
 const ast=Math.max(0,Math.round(ast36*k*(1+gauss()*.35)));
 const stl=Math.max(0,Math.round((.22+D.steal*.0095+D.perD*.004+D.speed*.005)*k*tmul(S,'stl')*(SM.stl||1)*(1+gauss()*.5)));
 const blk=Math.max(0,Math.round(Math.max(0,-1+(h-72)*.1+D.block*.016+D.intD*.004+D.jump*.006)*k*tmul(S,'blk')*(SM.blk||1)*(1+gauss()*.6)));
 const ballSec=(sb.dribSec+sb.press+sb.protect)/3;
 const tov=Math.max(0,Math.round(clamp(.9+fga36*.05+ast36*.12-ballSec*.011,.25,6)*k*tmul(S,'tov')*(1+gauss()*.4)));
 const pf=Math.max(0,Math.round(clamp(2.0+(D.steal+D.block-100)*.006-(D.oiq-50)*.01,1,4.5)*k*tmul(S,'pf')*(1+gauss()*.3)));
 return{min,pts,reb:oreb+dreb,ast,stl,blk,tov,pf,fgm,fga:fgaT,tpm,tpa,ftm,fta,oreb,dreb,fgp:fgaT?fgm/fgaT:0,tpp:tpa?tpm/tpa:0}}

function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function injuryRoll(S,c){
 const sc=c.games/82;
 let lam=(.9+(80-S.dur)*.02+(S.age>30?.5:0)+(S.age<20?-.2:0)+(S.injuryRisk||0)*4)*(c.scale==='nba'?1:c.scale==='college'?.55:.4);
 lam=Math.max(.15,lam*tmul(S,'inj')*shoeInj(S));
 const n=Math.min(4,poisson(lam)),out=[],used=new Set();
 for(let i=0;i<n;i++){
  const r=Math.random()+(S.age>31?.03:0);let k;
  if(r<.62)k={kind:pick(['발목 염좌','무릎 타박상','허리 통증','손가락 부상','종아리 경련']),games:ri(1,5)};
  else if(r<.9)k={kind:pick(['햄스트링 부상','손목 골절','어깨 염좌','종아리 근육 파열','발 부상']),games:ri(6,18)};
  else if(r<.975)k={kind:pick(['피로골절','반월판 부분 파열','어깨 탈구']),games:ri(22,45),serious:true};
  else k={kind:pick(['십자인대 파열','아킬레스건 파열']),games:Math.round(82*rnd(.6,1)),major:true};
  k.games=Math.min(c.games,Math.max(1,Math.round(k.games*(c.scale==='nba'?1:Math.min(1,sc*1.4+.1)))));
  let s=-1;for(let t=0;t<12&&s<0;t++){const st=ri(0,Math.max(0,c.games-k.games));let ok=true;for(let j=st;j<st+k.games;j++)if(used.has(j)){ok=false;break}if(ok)s=st}
  if(s<0)continue;
  for(let j=s;j<s+k.games;j++)used.add(j);
  k.start=s;out.push(k);if(k.major)break}
 return out}

const LAB={hs:['지역 예선','8강','4강','결승'],college:['1라운드','2라운드','스위트 16','엘리트 8','파이널포','결승'],pro:['1라운드','준결승','결승'],nba:['1라운드','2라운드','컨퍼런스 파이널','파이널']};
function serScore(sc,won){if(sc==='nba')return won?'4-'+ri(0,3):ri(0,3)+'-4';const pf=ri(60,95),pa=won?pf-ri(1,15):pf+ri(1,15);return pf+'-'+pa}
function playoffs(S,c,wins,losses,T,o){
 const sc=c.scale,pct=wins/(wins+losses||1),out={rounds:0,result:'',champ:false,made:false,series:[]};
 const cfg={
  hs:{n:4,ok:pct>=.45,p:r=>sig((T+(pct-.5)*14)/8-r*.25),fail:'플레이오프 진출 실패'},
  college:{n:6,ok:pct>=.6||(pct>=.5&&c.level>=58),p:r=>sig((T+(pct-.6)*20)/9-r*.3),fail:'포스트시즌 진출 실패'},
  pro:{n:3,ok:pct>=.5,p:r=>sig((T+(pct-.55)*16)/8),fail:'플레이오프 진출 실패'},
  nba:{n:4,ok:pct>=.5,p:r=>sig((T*.7+(pct-.6)*14+(o-72)*.2)/8-r*.25-.15),fail:pct>=.43?'플레이인 탈락':'플레이오프 진출 실패'}}[sc];
 out.made=cfg.ok;if(!out.made){out.result=cfg.fail;return out}
 let r=0;
 for(;r<cfg.n;r++){const won=Math.random()<cfg.p(r);out.series.push({lab:LAB[sc][r],opp:oppFor(S),won,score:serScore(sc,won)});if(!won)break}
 out.rounds=r;out.champ=r===cfg.n;out.result=out.champ?WINT[sc]:RES[sc][r];return out}

/* league context: approximate rank of a per-game average among all players */
const RK={nba:{pts:[[32,1],[28,2],[26,5],[24,10],[22,20],[20,35],[18,60],[16,90],[14,130],[12,180],[10,230],[8,300],[5,380],[0,450]],reb:[[14,1],[12,3],[10,10],[8,30],[6,80],[4,180],[2,320],[0,450]],ast:[[11,1],[9,3],[7,10],[5,30],[3.5,80],[2,200],[0,450]]},
 college:{pts:[[26,1],[22,3],[20,10],[18,30],[16,70],[14,150],[12,300],[10,600],[8,1200],[5,2500],[0,4000]],reb:[[13,1],[11,5],[9,20],[7,80],[5,300],[3,1200],[0,4000]],ast:[[8,1],[6,8],[5,30],[4,100],[3,300],[2,900],[0,4000]]},
 hs:{pts:[[28,1],[24,5],[20,20],[16,80],[12,300],[8,1000],[4,3000],[0,6000]],reb:[[14,1],[11,8],[8,40],[6,200],[4,900],[0,6000]],ast:[[9,1],[6,10],[4,60],[2,400],[0,6000]]}};
RK.pro=RK.college;
function leagueRank(sc,stat,v){const t=RK[sc][stat];if(v>=t[0][0])return 1;for(let i=1;i<t.length;i++){if(v>=t[i][0]){const[a,ra]=t[i-1],[b,rb]=t[i];const k=(v-b)/(a-b);return Math.max(1,Math.round(rb-(rb-ra)*k))}}return t[t.length-1][1]}

function simSeason(S){
 const c=ctxOf(S),o=ovr(S);c.D=effD(S);c.sb=subsOf(c.D);
 const injs=S.forcedOut?[{kind:'학사 경고로 인한 출전 정지',games:Math.round(c.games*.5),start:0}]:injuryRoll(S,c);
 const miss={};injs.forEach(k=>{for(let j=k.start;j<k.start+k.games;j++)miss[j]=k.kind});
 const restP=c.scale!=='nba'?0:(S.age>=34?.12:S.age>=31?.08:S.age>=28?.045:S.age>=24?.015:.008)*(o>=78?1.3:1);
 const games=[];let w=0,l=0,best=null,ret=0,rests=0;
 const tot={g:0,min:0,pts:0,reb:0,ast:0,stl:0,blk:0,tov:0,pf:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0};
 const dnp=why=>({min:0,dnp:true,why,pts:0,reb:0,ast:0,stl:0,blk:0,tov:0,pf:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0});
 for(let i=0;i<c.games;i++){
  let g;
  if(miss[i]!==undefined){g=dnp(miss[i]);g.inj=true;ret=3}
  else if(Math.random()<restP){g=dnp('휴식(로드 매니지먼트)');g.rest=true;rests++}
  else{g=genGame(S,c,o);if(ret>0&&!g.dnp){ret--;for(const k of ['min','reb','ast','stl','blk','tov','pf','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb'])g[k]=Math.round(g[k]*.75);g.tpm=Math.min(g.tpm,g.fgm);g.reb=g.oreb+g.dreb;g.pts=2*(g.fgm-g.tpm)+3*g.tpm+g.ftm;g.fgp=g.fga?g.fgm/g.fga:0;g.tpp=g.tpa?g.tpm/g.tpa:0}}
  const contrib=g.min?((o-c.level)*.5+tadd(S,'win')*2+((S.media?S.media.locker:50)-50)*.01)*(g.min/36):0;
  const win=Math.random()<sig((c.T+contrib+gauss()*3)/7);
  g.win=win;win?w++:l++;
  g.pf=Math.round(rnd(58,95)*(c.scale==='hs'?.85:1));g.pa=g.pf+(win?ri(1,16):-ri(1,16));
  if(!g.dnp){tot.g++;for(const k in tot)if(k!=='g')tot[k]+=g[k]}
  if(!g.dnp&&(!best||g.pts>best.pts))best={n:i+1,pts:g.pts,reb:g.reb,ast:g.ast,win:g.win,pf:g.pf,pa:g.pa};
  games.push(g)}
 const n=Math.max(1,tot.g);

/* ---------- 스카우팅 평가: 진짜 잠재력은 숨기고 불확실성과 신뢰도를 함께 보여줌 ---------- */

 return{grade:g(est),lo:g(est-w),hi:g(est+w),est,conf:Math.round(conf*100),w}}

function devRating(S){

 let h=0;const s=(S.team&&S.team.name)||'';for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return .94+(h%13)/100}
function growthFactors(S,prog){
 const L=[],last=S.seasons[S.seasons.length-1];let m=1;
 if(last&&S.age<=26){const mf=clamp(.88+last.min/36*.22,.88,1.1);m*=mf;L.push({t:'출전 시간',v:mf})}
 const dr=devRating(S);m*=dr;L.push({t:'코칭·육성 환경',v:dr});
 if(S.injFlag){m*=.82;L.push({t:'큰 부상 여파',v:.82});S.injFlag=0}
 else if(S.dur<50){m*=.95;L.push({t:'컨디션 저하',v:.95})}
 const fit=({G:['scorer','playmaker','shooter'],W:['scorer','shooter','defender','allround'],B:['post','defender']}[S.pos]||[]).includes(S.style)?1.03:.97;
 m*=fit;L.push({t:'역할·스타일 적합도',v:fit});
 return{mult:m,list:L}}
function potDrift(S,notes){

 S.pot=clamp(S.pot+gauss()*(low?1.8:1.2),38,99);
 /* 잠재력은 절대 한계가 아니다: 늦게 터지는 선수(대기만성)는 낮은 평가에서도 크게 오른다 */
 const bo=S.age<=24?(low?.14:.035):0;
 if(r<bo){const u=low?ri(10,20):ri(6,12);S.pot=clamp(S.pot+u,38,99);S.breakout=(S.breakout||0)+1;notes&&notes.push(low?'대기만성: 평가가 완전히 뒤집힐 만큼 성장 폭이 커졌습니다':'급성장: 눈에 띄게 성장 폭이 커졌습니다')}
 else if(r>(low?.99:.965)){const u=S.pot>=78?ri(8,16):ri(4,9);S.pot=clamp(S.pot-u,38,99);S.bust=(S.bust||0)+1;notes&&notes.push('정체: 성장이 눈에 띄게 둔화됐습니다')}}
/* 노력이 평가를 넘어선 경우: 훈련을 이어가며 현재 한계에 닿으면 한계 자체가 올라간다 */
function potBreak(S,focus,notes){

 if(ovr(S)>=S.pot-1){const u=S.pot<66?rnd(1.8,3.8):rnd(1,2.6);S.pot=clamp(S.pot+u,38,99);S.pbk=(S.pbk||0)+1;if(S.pbk%3===1&&notes)notes.push('한계 돌파: 꾸준한 훈련으로 성장 한계가 올라갔습니다')}}

function migrateSave(S){

 S.a=S.a||{};

  S.d={};
  for(const g in LG){const base=S.a[g]??30,ks=LG[g];

 if(!S.gt)S.gt=({'-1':'early','0':'steady','1':'late'})[String(S.trait)]||'steady';
 if(!S.apt){S.apt={};DK.forEach(k=>S.apt[k]=clamp(1+gauss()*.12,.7,1.3))}

 sync(S);

 if(!S.trophies)S.trophies=[];

/* ================= v2 드래프트: 클래스 · 컴바인 · 팀별 평가 · 스카우트 보고서 ================= */
function mkRng(seed){let a=seed>>>0;const r=()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};const g=()=>{let u=0;for(let i=0;i<6;i++)u+=r();return(u-3)/Math.sqrt(.5)};return{r,g}}

const CATOF=Object.fromEntries(DA.map(x=>[x[0],x[2]]));

function combineOf(X,g){

 const eSh=D.three*.4+D.mid*.3+D.ft*.3,nSh=g()*4.5,eHa=D.handle*.7+D.oiq*.15+D.speed*.15,nHa=g()*4.5,ePa=D.pass*.8+D.oiq*.2,nPa=g()*4.5,eDf=D.perD*.5+D.speed*.3+D.intD*.2,nDf=g()*4.5;
 const wingN=g()*1.9,wing=h+2.7+wingN,reach=h*1.335+g()*1.3,wt=165+(h-72)*5.2+(D.strength-40)*.55+g()*5;
 const maxV=eMax+nMax;
 const res=[nMax/1.7,-nSp/.045,-nAg/.16,nSh/4.5,nHa/4.5,nPa/4.5,nDf/4.5];
 const dayZ=res.reduce((a,b)=>a+b,0)/res.length,wingPlus=clamp(wingN/1.9,-2,2);
 return{body:{h:h-.6,wt,wing,reach},ath:{maxV,standV:maxV-4.6-Math.abs(g())*.9,sprint:eSp+nSp,agil:eAg+nAg},
  skill:{shoot:clamp(eSh+nSh,5,99),handle:clamp(eHa+nHa,5,99),pass:clamp(ePa+nPa,5,99),def:clamp(eDf+nDf,5,99)},dayZ,wingPlus,adj:dayZ*1.3+wingPlus*.4}}
const CB_ROWS={body:[['h','신장(맨발)','in','h'],['wt','체중','lb','wt'],['wing','윙스팬','in','wing'],['reach','스탠딩 리치','in','reach']],
 ath:[['maxV','최대 수직 점프','in','maxV'],['standV','제자리 수직 점프','in','standV'],['sprint','스프린트(3/4코트)','초','sprint',1],['agil','민첩성(레인 어질리티)','초','agil',1]],
 skill:[['shoot','슈팅','점','shoot'],['handle','볼 핸들링','점','handle'],['pass','패스','점','pass'],['def','수비 움직임','점','def']]};
function cbPct(cls,grp,key,v,lowBetter){const a=cls.map(p=>p.cb[grp][key]);const n=a.filter(x=>lowBetter?x>v:x<v).length;return Math.round(100*n/a.length)}

/* ----- 드래프트 클래스: 시드로 매번 동일하게 재생성 (저장 데이터에는 시드만 보관) ----- */
let __cls=null;
function draftClass(seed){
 if(__cls&&__cls.seed===seed)return __cls.list;
 const R=mkRng(seed),list=[];
 for(let i=0;i<62;i++){
  const score=81-i*.31+R.g()*1.5,rp=R.r(),pos=rp<.38?'G':rp<.72?'W':'B';
  const pot=clamp(score+6+R.g()*4,50,99),target=clamp((score-.3*pot)/.7,45,92);
  const h=pos==='G'?R.g()*1.8+75:pos==='W'?R.g()*1.6+79:R.g()*1.6+83;
  const bent=['scorer','playmaker','defender','shooter','post','allround'][Math.floor(R.r()*6)],sw=STY[bent].w;
  const d={};let p=0;for(const k of DK){d[k]=50+R.g()*6+(sw[k]*16-1)*7+(PW[pos][k]*16-1)*4;}
  p=ovrParts(d,pos);const sh=target-p;DK.forEach(k=>d[k]=Math.round(clamp(d[k]+sh,15,97)*10)/10);
  const X={i,score,pos,h,pot,d,age:19+Math.floor(R.r()*3),name:FN[Math.floor(R.r()*FN.length)]+' '+LN[Math.floor(R.r()*LN.length)],sch:COLLEGES[Math.floor(R.r()*COLLEGES.length)].name};
  X.style=styleOf(X);X.ovr=ovr(X);X.cb=combineOf(X,R.g);X.adj=X.cb.adj;list.push(X)}
 __cls={seed,list};return list}
let __tp={};
function teamProf(name,seed){
 const k=name+seed;if(__tp[k])return __tp[k];
 const R=mkRng(hashS(name)),Y=mkRng(hashS(name)^seed),cats=['sc','of','df','rb','ph'];
 const cs=cats.slice().sort(()=>R.r()-.5).slice(0,2),favK=DK.filter(x=>cs.includes(CATOF[x]));
 const need={};['G','W','B'].forEach(p=>need[p]=clamp(1+(R.r()-.5)*.8+Y.g()*.4,.4,1.7));
 return __tp[k]={name,cats:cs,favK,need,ath:clamp(1+R.g()*.3,.5,1.5),youth:clamp(1+R.g()*.3,.5,1.5)}}
const CATN={sc:'득점력',of:'공격 기술',df:'수비',rb:'리바운드',ph:'신체 능력'};
const POSN={G:'가드',W:'윙',B:'빅맨'};
function teamNeedText(tp){const n=Object.entries(tp.need).sort((a,b)=>b[1]-a[1]);return(n[0][1]>1.15?POSN[n[0][0]]+' 보강 필요 · ':'')+tp.cats.map(c=>CATN[c]).join('·')+' 선호'}
function teamValue(tp,X,base,useCb){
 let f=0;for(const k of tp.favK)f+=X.d[k]-55;f=f/tp.favK.length*.18;
 return base+f+(tp.need[X.pos]-1)*2.6+(X.pot-X.ovr)*.03*(tp.youth-1)+(useCb?(X.adj||0)*tp.ath:0)}
function userProspect(S){
 return{d:S.d,pos:S.pos,h:S.h,pot:S.pot,ovr:ovr(S),adj:S.combine?S.combine.adj:0,base:draftScore(S)-1.8}}
function ensureDC(S){
 if(!S.dc||S.dc.age!==S.age||S.dc.stage!==S.stage)S.dc={seed:ri(1,2e9),age:S.age,stage:S.stage,bias:gauss()*1.6,work:{},pre:null,post:null};
 return S.dc}
/* 한 번의 드래프트 시뮬레이션: 팀마다 자기 평가로 가장 높은 선수를 고른다 */
const ng=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
function simDraftOnce(S,mode){
 const dc=S.dc,cls=draftClass(dc.seed),U=userProspect(S),N=cls.length+1;
 const post=mode!=='pre',proj=mode==='pre'||mode==='post';
 const order=PRO_TEAMS.slice().sort(()=>Math.random()-.5),vals={};
 for(const t of PRO_TEAMS){const tp=teamProf(t,dc.seed),v=new Array(N);
  for(let i=0;i<cls.length;i++)v[i]=teamValue(tp,cls[i],cls[i].score,post)+ng()*1.7;
  const w=dc.work&&dc.work[t];
  const nz=w!==undefined?1.0:post?2.0:2.7;
  v[N-1]=teamValue(tp,U,U.base,post)+ng()*nz+(proj?dc.bias*(post?.5:1):0)+(w!==undefined?w+.6:0);
  vals[t]=v}
 const taken=new Array(N).fill(false),board=[];let mine=0,team=null;
 for(let n=0;n<60;n++){const t=order[n%30],v=vals[t];let b=-1,bv=-1e9;
  for(let i=0;i<N;i++)if(!taken[i]&&v[i]>bv){bv=v[i];b=i}
  taken[b]=true;board.push({n:n+1,team:t,i:b});if(b===N-1){mine=n+1;team=t}}
 return{pick:mine,team,board}}
function projectDraft(S,mode,runs){
 runs=runs||100;const cnt=[],tc={};let und=0;
 for(let r=0;r<runs;r++){const x=simDraftOnce(S,mode);if(!x.pick){und++;cnt.push(61)}else{cnt.push(x.pick);tc[x.team]=(tc[x.team]||0)+1}}
 cnt.sort((a,b)=>a-b);const q=p=>cnt[Math.min(runs-1,Math.floor(p*runs))];
 const teams=Object.entries(tc).map(([t,c])=>[t,c/runs]).sort((a,b)=>b[1]-a[1]);
 return{lo:q(.1),med:q(.5),hi:q(.9),und:und/runs,teams}}
/* 팀 보드: 노이즈 없이 각 팀이 이 선수를 클래스 전체 중 몇 위로 보는가 */
function boardRank(S,t,post){
 const dc=S.dc,cls=draftClass(dc.seed),tp=teamProf(t,dc.seed),U=userProspect(S);
 const w=dc.work&&dc.work[t];
 const uv=teamValue(tp,U,U.base,post)+(w!==undefined?w+.6:0);
 let r=1;for(const X of cls)if(teamValue(tp,X,X.score,post)>uv)r++;return r}
const gradeOfPick=p=>p<=3?'A+':p<=8?'A':p<=14?'A-':p<=22?'B+':p<=30?'B':p<=40?'B-':p<=50?'C+':p<=60?'C':'D';
const rangeTxt=(lo,hi)=>lo>60?'언드래프트 가능성 높음':(hi>60?`${lo}순위 ~ 2라운드 후반/언드래프트`:`${lo}~${hi}순위`);
function doCombine(S){
 const dc=ensureDC(S),cb=combineOf({d:S.d,h:S.h},gauss);
 const cls=draftClass(dc.seed);
 cb.pct={};for(const g in CB_ROWS)CB_ROWS[g].forEach(r=>{cb.pct[r[0]]=cbPct(cls,g,r[0],cb[g][r[0]],r[4]===1)});
 S.combine={...cb,year:S.age};return S.combine}
function doWorkouts(S){
 const dc=ensureDC(S),U=userProspect(S),res={};
 for(const t of (dc.sel||[])){

function scoutReport(S,mode){

 const mean={},sd={};DK.forEach(k=>{const a=cls.map(x=>x.d[k]),m=a.reduce((x,y)=>x+y,0)/a.length;mean[k]=m;sd[k]=Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length)||1});
 const z=k=>(D[k]-mean[k])/sd[k];
 const relevant=DK.filter(k=>P[k]*16>=.8);
 const str=DK.slice().sort((a,b)=>z(b)*(.6+P[b]*8)-z(a)*(.6+P[a]*8)).slice(0,3).filter(k=>z(k)>.15);

 if(D.strength<mean.strength-6)why.push('NBA 수준 몸싸움에 대비한 근력 보강 필요');if(D.oiq>mean.oiq+6)why.push('경기 이해도가 높아 적응이 빠를 것');
 if(D.three<mean.three-8&&S.pos!=='B')why.push('외곽 슛 거리가 NBA와 차이');if(D.speed>mean.speed+6)why.push('스피드가 NBA 수비에도 통할 수준');

 const conf=clamp(Math.round(se.conf*.55+(mode!=='pre'?18:0)+Object.keys(dc.work||{}).length*7),20,95);
 return{mode,pr,grade:gradeOfPick(pr.med),str,weak,z,style:STY[S.style].n,traits:(S.traits||[]).map(t=>TRAITS[t].n),
  adapt:ad>=8?'높음':ad>=2?'보통':'낮음',why,imp,growth:`${se.lo}~${se.hi} (중심 ${se.grade})`,conf,cb:S.combine||null,se}}

/* ---------- transitions ---------- */
function transition(){
 const S=window.S;
 if(S.goPortal){S.goPortal=false;return go('portal')}
 if(S.stage==='hs')return go(S.grade<12?'offseason':'recruit');
 if(S.stage==='college')return go('draftq');
 if(S.stage==='pro'){
  if(!S.draft)return go('draftq');
  const o=ovr(S);
  if(S.age<=28&&Math.random()<clamp((o-68)*.08,0,.8)){
   S.stage='nba';S.team={name:pick(PRO_TEAMS),T:ri(-6,6)};S.contract=simpleC('call',2,vetMin(S));if(S.draft&&S.draft.undrafted)S.flags.sleeper=1;
   S.evt={id:'callup',done:true,next:'offseason',res:`${S.team.name}에서 계약을 제안했습니다. NBA 로스터에 이름을 올렸습니다.`};logit('NBA 계약 획득: '+S.team.name);
   return go('event')}
  if(S.age>=28||o<46)return go('retireq');
  return go('offseason')}
 S.cn=contractTick(S);
 return nbaNext()}

function genOffers(S,mode){
 const sc=mode==='hs'?hsScore(S):ovr(S)+S.hype*.1+2,th={1:66,2:56,3:46,4:30};
 let o=COLLEGES.filter(c=>(mode!=='portal'||c.name!==S.school.name)&&(c.tier<4||sc<56)&&sc+gauss()*2.5>=th[c.tier]-(c.tier===1?0:2));
 if(S.gpa<2.3&&mode==='hs')o=o.filter(c=>c.tier===3);
 const t3=COLLEGES.filter(c=>(sc<50?c.tier===4:c.tier===3)&&!o.includes(c));
 if(sc<54)o=o.filter(c=>c.tier>=3);
 if(sc<50)o=o.filter(c=>c.tier>=4||Math.random()<.35);
 while(o.length<2&&t3.length)o.push(t3.splice(ri(0,t3.length-1),1)[0]);
 return o.slice(0,7)}

function rankTags(u){

 const lim={nba:30,college:60,pro:15,hs:25}[u.scale]||30,L={pts:'득점',reb:'리바운드',ast:'어시스트'},o=[];
 for(const k of ['pts','reb','ast'])if(u.ranks[k]<=lim)o.push(`<span class="tag">${u.scale==='nba'?'리그':u.scale==='college'?'전국':'주'} ${L[k]} ${u.ranks[k]}위</span>`);

/* ---------- live draft board ---------- */
function draftnightScreen(){
 const S=window.S,d=S.dn;if(d.seen)return draftReveal();
 const total=d.undrafted?60:d.pick;let pl;
 if(d.board){pl=d.board.slice(0,total).map(x=>({...x}))}
 else{const order=PRO_TEAMS.slice().sort(()=>Math.random()-.5);
 if(!d.undrafted){const idx=(d.pick-1)%30,j=order.indexOf(d.team);if(j>=0)[order[idx],order[j]]=[order[j],order[idx]]}
 pl=Array.from({length:total},(_,i)=>({n:i+1,team:order[i%30],name:pick(FN)+' '+pick(LN),pos:pick(['G','W','B']),sch:pick(COLLEGES).name}));
 if(!d.undrafted)Object.assign(pl[d.pick-1],{name:S.name,pos:S.pos,sch:S.stage==='pro'?'프로 패스웨이':S.school.name})}
 if(CFG.speed===0){S.dn.seen=true;return draftReveal()}
 let i=0;const shown=[];
 M(`<div class="card"><h3>NBA 드래프트 · 라이브</h3><div class="score"><div class="teams"><span id="dTeam">—</span><span id="dRd">1라운드</span></div><div class="big" id="dPick">#1</div><div id="dName" class="sm">커미셔너가 연단에 오릅니다</div></div><div id="dList"></div><button class="btn" data-a="dSkip">건너뛰기</button></div>`);
 const done=()=>{S.dn.seen=true;save();draftReveal()};
 const step=()=>{
  if(!$('#dPick'))return;
  const p=pl[i++],mine=!d.undrafted&&p.n===d.pick;
  $('#dPick').textContent='#'+p.n;$('#dTeam').textContent=p.team;$('#dRd').textContent=p.n>30?'2라운드':'1라운드';
  $('#dName').innerHTML=mine?`<b style="color:var(--led)">${p.team}의 선택은 — ${S.name}!</b>`:`${p.name} · ${p.pos} · ${p.sch}`;
  shown.unshift(p);shown.length=Math.min(shown.length,5);
  $('#dList').innerHTML=shown.map(x=>`<div class="lower"${x.n===d.pick&&!d.undrafted?' style="outline:2px solid var(--accent)"':''}><i>#${x.n}</i><span>${x.team}<small>${x.name} · ${x.pos} · ${x.sch}</small></span></div>`).join('');
  if(i>=total){timer=setTimeout(done,mine?1500:900);return}
  const left=total-i,spd=CFG.speed===0?1:CFG.speed||1;
  const delay=(p.n<=5?900:p.n<=14?480:p.n<=30?220:140)*(left<=3&&total>8?3:1)/spd;
  timer=setTimeout(step,Math.max(30,delay))};
 timer=setTimeout(step,500)}
acts.dSkip=()=>{clearTimeout(timer);window.S.dn.seen=true;go('draftnight')};

/* ---------- career card + hall of fame ---------- */
function careerTier(S){
 const h=hofScore(S);
 if(S.ct.nbaYears>0)return h>=60?'HALL OF FAME':h>=35?'FUTURE HALL OF FAMER':h>=15?'ALL-STAR CAREER':'NBA ROTATION PLAYER';
 if(S.seasons.some(s=>s.stage==='college'))return S.seasons.some(s=>s.stage==='college'&&s.ovr-(s.stage==='college'?58:0)>=8)?'COLLEGE STAR':'COLLEGE PLAYER';
 return starsOf(S)>=4?'HIGH SCHOOL LEGEND':'HIGH SCHOOL HOOPER'}
function mainTeam(S){
 const nb=S.seasons.filter(s=>s.stage==='nba'),m={};nb.forEach(s=>m[s.team]=(m[s.team]||0)+1);
 const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return e?{name:e[0],n:e[1]}:null}

 for(let t=0;t<80;t++){const sil=fix.sil||pick(B.sil),up=fix.up||pick(B.up),mid=fix.mid||pick(B.mid),out=fix.out||pick(B.out);if(okCombo(sil,up,mid,out))return{sil,up,mid,out}}
 for(const sil of B.sil)for(const up of B.up)for(const mid of B.mid)for(const out of B.out)if(okCombo(sil,up,mid,out))return{sil,up,mid,out}}
function shoeName(S,brand,kind,gen,base,sp){
 const h=shoeEnsure(S),used=new Set(h.owned.map(x=>x.name).concat(h.history.map(x=>x.name))),ln=lastName(S.name);
 if(kind==='sig')return ln+' '+gen;
 if(kind==='se')return base+' '+SE[sp].n.split(' ')[0];
 const pre=BR[brand].pre.slice().sort(()=>Math.random()-.5);
 for(let t=0;t<40;t++){const p=pre[t%pre.length],nm=p+(kind==='pe'?' PE · '+ln:' '+ri(2,9)+(t>=pre.length?String.fromCharCode(65+t%26):''));if(!used.has(nm))return nm}
 return pre[0]+' '+Date.now()%1000}
function genShoe(S,brand,kind,o){
 o=o||{};const h=shoeEnsure(S),B=BR[brand],cb=pickCombo(brand,o.fix),pal=o.pal||pick(B.pal);
 const c=(kind==='pe'||kind==='sig')&&!o.pal?[pal[0],teamColors(S).c1,pal[2]]:pal.slice();
 const gen=o.gen||0,nm=o.name||shoeName(S,brand,kind,gen,o.base,o.sp);
 return{id:'s'+(++h.seq),brand,name:nm,kind,...cb,c,sp:o.sp||null,gen,age:S.age,season:seasonLbl(S),stamp:o.sp==='farewell'?String(2026+S.seasons.length):undefined}}
/* 능력치 효과: 착용 중에만 적용, 개별 ±3, 총 +7 상한 */
function shoeEffects(sh){
 if(!sh||!BR[sh.brand])return{mods:{},inj:1};
 const m=KIND[sh.kind]?KIND[sh.kind].m:1,fx=BR[sh.brand].fx,mods={};let pos=0;
 for(const k in fx){if(k==='inj')continue;const v=clamp(rd(fx[k]*m,10),-3,3);mods[k]=v;if(v>0)pos+=v}
 if(pos>7){const f=7/pos;for(const k in mods)if(mods[k]>0)mods[k]=rd(mods[k]*f,10)}
 return{mods,inj:fx.inj?clamp(1-(1-fx.inj)*m,.88,1):1}}
function wornShoe(S){const h=S.shoes;if(!h||!h.worn)return null;return h.owned.find(x=>x.id===h.worn)||null}
function shoeMods(S){if(S.stage!=='nba'&&S.stage!=='pro')return{};return shoeEffects(wornShoe(S)).mods}
function shoeInj(S){if(S.stage!=='nba'&&S.stage!=='pro')return 1;return shoeEffects(wornShoe(S)).inj}
function fxText(sh){const e=shoeEffects(sh),p=Object.entries(e.mods).map(([k,v])=>`${DN[k]} ${v>0?'+':''}${v}`);if(e.inj<1)p.push(`부상 위험 -${Math.round((1-e.inj)*100)}%`);return p.join(' · ')||'효과 없음'}
function designText(sh){return `${SILN[sh.sil]} (${SILH(sh.sil)}) · 갑피 ${UPN[sh.up]} · 중창 ${MIDN[sh.mid]} · 밑창 ${OUTN[sh.out]}`}

/* ----- 단계와 제안 ----- */
function shoeTier(S){
 if(S.stage!=='nba'&&S.stage!=='pro')return 0;const c=S.ct,o=ovr(S);let t=0;
 if(o>=66||S.hype>=45||(S.draft&&S.draft.pick>0&&S.draft.pick<=14)||c.allstar>=1)t=1;
 if(c.allstar>=1)t=2;if(c.allstar>=2||c.allnba>=1||o>=84||S.hype>=85)t=Math.max(t,t>=2?3:t);
 if(c.mvp>=1||c.fmvp>=1)t=4;return t}
const TIERN=['루키','유망주','올스타','슈퍼스타','MVP급'];
const tierKind=S=>S.ct.allstar>=1?'signature':'endorse';
function offerBase(S){const c=S.ct,o=ovr(S);return (1+((S.media?S.media.image:50)-50)*.004)*(.3+S.hype*.04+Math.max(0,o-62)*.15+c.allstar*.5+c.allnba*.7+c.mvp*2.5+c.titles*.6+c.fmvp)}
function affinity(S,b){const fx=BR[b].fx;let t=0,n=0;for(const k in fx)if(S.d[k]!==undefined&&fx[k]>0){t+=S.d[k];n++}return clamp(.9+((n?t/n:50)-55)*.006,.85,1.2)}
function makeOffers(S,kind,renew){
 const base=offerBase(S);let bs=BRK.slice().sort(()=>Math.random()-.5).slice(0,3);
 if(renew){bs=bs.filter(b=>b!==renew).slice(0,2);bs.unshift(renew)}
 return bs.map(b=>{const v=base*affinity(S,b)*rnd(.85,1.2)*(kind==='signature'?1.9:1)*(b===renew?1.06:1),years=ri(2,4)+(kind==='signature'?1:0);
  const sh=genShoe(S,b,'pe');
  return{brand:b,kind,years,base:rd(v),bonus:rd(v*.6*years/2),perf:rd(v*.5),roy:kind==='signature'?rd(.04+v*.002,1000):0,shoe:sh,renew:b===renew}})}
function signContract(S,o){
 const h=shoeEnsure(S);
 h.contract={brand:o.brand,kind:o.kind,years:o.years,left:o.years,base:o.base,perf:o.perf,roy:o.roy,bonus:o.bonus,since:S.age,earned:0,upOffered:o.kind==='signature'?1:0};
 S.money+=o.bonus;
 const sh=o.shoe;h.owned.push(sh);h.worn=sh.id;
 h.history.push({age:S.age,season:seasonLbl(S),t:'contract',brand:o.brand,name:sh.name,kind:o.kind,note:`${o.years}년 · 계약금 ${money(o.bonus)}`});
 if(o.kind==='signature')S.hype=clamp(S.hype+3,0,100);
 return `${BR[o.brand].n}와(과) ${o.years}년 ${kindLbl[o.kind]}을 맺었습니다. 계약금 ${money(o.bonus)}, 선수 전용 모델 "${sh.name}"을(를) 신습니다.`}
function nextRelease(S,aw){
 const h=shoeEnsure(S),ct=h.contract;if(!ct||ct.kind!=='signature')return null;
 const t=shoeTier(S),sigs=h.owned.filter(x=>x.kind==='sig'),last=sigs[sigs.length-1];
 if(!sigs.length&&t>=3){return{t:'first',gen:1,brand:ct.brand}}
 if(sigs.length&&t>=4){
  const g=Math.max(...sigs.map(x=>x.gen||1));
  const mk=(sp)=>({t:'se',sp,brand:ct.brand,gen:g,base:last.name});
  if(aw.includes('NBA 챔피언')&&!h.owned.some(x=>x.sp==='champ'&&x.season===seasonLbl(S)))return mk('champ');
  if(aw.includes('MVP')&&!h.owned.some(x=>x.sp==='mvp'&&x.season===seasonLbl(S)))return mk('mvp');
  if(aw.includes('올스타')&&!h.owned.some(x=>x.sp==='allstar'&&S.age-x.age<3))return mk('allstar');
  if(S.age-last.age>=2)return{t:'follow',gen:g+1,brand:ct.brand}}
 return null}
function buildRelease(S,r){
 const h=shoeEnsure(S),sigs=h.owned.filter(x=>x.kind==='sig'),last=sigs[sigs.length-1];
 if(r.t==='first')return genShoe(S,r.brand,'sig',{gen:1});
 if(r.t==='follow')return genShoe(S,r.brand,'sig',{gen:r.gen,fix:{sil:last.sil}});
 return genShoe(S,r.brand,'se',{sp:r.sp,gen:r.gen,base:r.base,fix:{sil:last.sil,up:last.up,mid:last.mid,out:last.out},pal:last.c.slice()})}
function shoeCycle(S){
 if(S.stage!=='nba'&&S.stage!=='pro')return false;
 const h=shoeEnsure(S),ct=h.contract,aw=(S.sum&&S.sum.aw)||[];
 if(ct&&ct.left<=0){h.history.push({age:S.age,season:seasonLbl(S),t:'end',brand:ct.brand,name:'',kind:ct.kind,note:`계약 만료 · 누적 수입 ${money(ct.earned)}`});h.contract=null;
  S.evt={id:'shoeDeal',done:false,offers:makeOffers(S,tierKind(S),ct.brand),renew:ct.brand};go('event');return true}
 if(ct){
  if(ct.kind==='endorse'&&S.ct.allstar>=1&&!ct.upOffered){ct.upOffered=1;const o=makeOffers(S,'signature',ct.brand)[0];S.evt={id:'shoeDeal',done:false,offers:[o],up:true};go('event');return true}
  if(ct.kind==='signature'){const r=nextRelease(S,aw);if(r){S.evt={id:'shoeRel',done:false,rel:r,shoe:buildRelease(S,r)};go('event');return true}}
  return false}
 if(shoeTier(S)>=1&&S.age-(h.lastOffer||0)>=2){h.lastOffer=S.age;S.evt={id:'shoeDeal',done:false,offers:makeOffers(S,tierKind(S))};go('event');return true}
 return false}
function perfFrac(S,r,aw){let f=0;if(aw.includes('올스타'))f+=.35;if(aw.some(x=>x.startsWith('올-NBA')))f+=.25;if(aw.includes('NBA 챔피언'))f+=.25;if(aw.includes('MVP'))f+=.5;if(r.avg.pts>=20)f+=.25;if(r.avg.pts>=25)f+=.15;return clamp(f,0,1)}
function shoeYear(S,r,aw){
 const h=S.shoes;if(!h||!h.contract||(r.stage!=='nba'&&r.stage!=='pro'))return null;
 const ct=h.contract,w=wornShoe(S),wb=w&&w.brand===ct.brand,pf=perfFrac(S,r,aw||[])*ct.perf*(wb?1:.5),o=ovr(S);
 const hasSig=h.owned.some(x=>x.kind==='sig'),rev=hasSig?Math.max(.5,S.hype*1.6+(o-60)*1.2):0;
 const inc=ct.base+pf+rev*ct.roy;S.money+=inc;ct.earned+=inc;h.sales+=rev;ct.left--;
 const nm=hasSig?h.owned.filter(x=>x.kind==='sig').slice(-1)[0].name:BR[ct.brand].n;
 return{name:nm,rev,inc,text:hasSig?`${BR[ct.brand].n} ${nm} 올 시즌 판매 ${money(rev)} · 내 몫 ${money(inc)}`:`${BR[ct.brand].n} 후원 수입 ${money(inc)}${wb?'':' (계약 브랜드 신발 미착용으로 성과 보너스 절반)'}`}}
function shoeRetire(S){
 const h=S.shoes;if(!h||!h.contract)return;
 const ct=h.contract,sigs=h.owned.filter(x=>x.kind==='sig');
 if(ct.kind==='signature'&&sigs.length){const last=sigs[sigs.length-1],sh=genShoe(S,ct.brand,'se',{sp:'farewell',gen:last.gen,base:last.name,fix:{sil:last.sil,up:last.up,mid:last.mid,out:last.out},pal:last.c.slice()});h.owned.push(sh);h.history.push({age:S.age,season:seasonLbl(S),t:'release',brand:ct.brand,name:sh.name,kind:'se',sp:'farewell',note:'은퇴 기념판 출시'})}
 h.history.push({age:S.age,season:seasonLbl(S),t:'end',brand:ct.brand,name:'',kind:ct.kind,note:`은퇴로 계약 종료 · 누적 수입 ${money(ct.earned)}`});h.contract=null}

/* ----- 이벤트 ----- */
function offerCard(o){const sh=o.shoe,B=BR[o.brand];
 return `<div class="ccard" style="padding:10px;margin:8px 0"><div class="row" style="align-items:center;gap:10px"><div style="width:44px">${logoMini(o.brand)}</div><div><b>${B.n}</b> <span class="tag">주력 · ${B.focus}</span>${o.renew?' <span class="tag">재계약</span>':''}<div class="muted sm">${B.tag}</div></div></div><div style="margin:4px 0">${shoeArt(sh,{sm:1})}</div><div class="sm"><b>${esc(sh.name)}</b> · ${designText(sh)}</div><div class="muted sm">착용 효과: ${fxText(sh)}</div></div>`}
function logoMini(b){return `<svg viewBox="0 0 32 32" width="40" height="40" role="img" aria-label="${b} 로고" style="background:${BR[b].pal[2][0]};border-radius:8px;padding:5px;box-sizing:border-box">${logoSVG(b,0,0,32,BR[b].pal[2][1],BR[b].pal[2][2])}</svg>`}
EVENTS.push({id:'shoeDeal',when:()=>false,
 title:S=>S.evt.up?'시그니처 계약 승격 제안':S.evt.renew?'신발 계약 만료 · 재계약':'신발 브랜드 계약 제안',
 text:S=>{const t=shoeTier(S);return S.evt.up?'올스타가 되자 계약 브랜드가 이름을 건 시그니처 라인을 제안합니다. 슈퍼스타 수준에 오르면 첫 시그니처 모델이 출시됩니다.':`${TIERN[t]} 단계의 선수로 인정받아 브랜드들이 접촉해 왔습니다. 인기·성적·수상 경력이 계약 조건에 반영됩니다. 같은 선수라도 브랜드에 따라 착용 효과가 다릅니다.`},
 extra:S=>S.evt.offers.map(offerCard).join(''),
 mk:S=>S.evt.offers.map((o,i)=>({t:`${BR[o.brand].n} · ${kindLbl[o.kind]} ${o.years}년${o.renew?' (재계약)':''}`,d:`계약금 ${money(o.bonus)} · 연 ${money(o.base)} · 성과 보너스 최대 ${money(o.perf)}${o.roy?` · 판매 로열티 ${Math.round(o.roy*100)}%`:''}`,
  f:S=>{if(S.evt.up&&S.shoes.contract){const old=S.shoes.contract;S.shoes.history.push({age:S.age,season:seasonLbl(S),t:'end',brand:old.brand,name:'',kind:old.kind,note:'시그니처 계약으로 승격'})}return signContract(S,o)}})).concat([{t:'이번에는 거절한다',d:'일반 신발을 신고 다음 기회를 기다립니다. 거절한 제안은 사라집니다.',f:S=>'계약을 거절했습니다. 인기와 성적이 오르면 더 좋은 제안이 올 수 있습니다.'}])});
EVENTS.push({id:'shoeRel',when:()=>false,
 title:S=>S.evt.rel.t==='first'?'첫 시그니처 신발 출시':S.evt.rel.t==='follow'?'시그니처 후속 모델 출시':SE[S.evt.rel.sp].n+' 출시',
 text:S=>`${BR[S.evt.rel.brand].n}에서 "${S.evt.shoe.name}"을(를) 출시합니다. ${S.evt.rel.t==='se'?'특별 디자인: '+SE[S.evt.rel.sp].d:'선수의 이름을 건 모델입니다.'}`,
 extra:S=>`<div class="ccard" style="padding:10px">${shoeArt(S.evt.shoe)}<div class="sm"><b>${esc(S.evt.shoe.name)}</b> · ${designText(S.evt.shoe)}</div><div class="muted sm">착용 효과: ${fxText(S.evt.shoe)}</div></div>`,
 mk:S=>[{t:'출시하고 바로 신는다',d:'새 모델을 착용합니다. 기존 신발은 컬렉션에 남습니다.',f:S=>relShoe(S,true)},{t:'출시하고 보관한다',d:'지금 신는 신발을 유지합니다.',f:S=>relShoe(S,false)}]});
function relShoe(S,wear){
 const h=shoeEnsure(S),sh=S.evt.shoe,r=S.evt.rel;h.owned.push(sh);if(wear)h.worn=sh.id;
 h.history.push({age:S.age,season:seasonLbl(S),t:'release',brand:sh.brand,name:sh.name,kind:sh.kind,sp:sh.sp,note:r.t==='first'?'첫 시그니처 출시':r.t==='follow'?'후속 모델 출시':SE[r.sp].n});
 S.hype=clamp(S.hype+(r.t==='se'?4:r.t==='first'?6:3),0,100);
 return `"${sh.name}" 출시! ${wear?'지금부터 이 신발을 신습니다.':'컬렉션에 보관했습니다.'}`}

const OLDBR={'Nike':'VELOZ','Adidas':'ARCLYN','Under Armour':'TITANOR','New Balance':'WARDEN','Puma':'SKYRIDE','Anta':'MAESTRO'};
function migrateSave2(S){
 if(S.evt&&(S.evt.id==='sigshoe'||S.evt.id==='shoe')){S.evt=S.evt.done?{id:'shoeDeal',done:true,res:S.evt.res||'신발 계약 이벤트가 완료되었습니다.',offers:[]}:null;if(!S.evt&&S.phase==='event')S.phase='summary'}
 if(S.shoe&&typeof S.shoe==='object'){
  const h=shoeEnsure(S),b=OLDBR[S.shoe.brand]||pick(BRK);
  const sh=genShoe(S,b,'sig',{gen:S.shoe.gen||1,name:S.shoe.name||undefined});sh.age=S.shoe.since||S.age;
  h.owned.push(sh);h.worn=sh.id;h.sales+=S.shoe.sales||0;
  h.contract={brand:b,kind:'signature',years:4,left:3,base:2+S.hype*.1,perf:1,roy:.05,bonus:0,since:S.shoe.since||S.age,earned:0,upOffered:1};
  h.history.push({age:S.shoe.since||S.age,season:'',t:'release',brand:b,name:sh.name,kind:'sig',note:'기존 시그니처 라인 (이전된 기록)'});
  S.shoeOld=S.shoe;delete S.shoe}
 if(S.shoes)shoeEnsure(S)}

function ivPick(S,kind){
 S.iused=S.iused||[];const pool=IV[kind];
 let free=pool.map((_,i)=>i).filter(i=>!S.iused.includes(kind+i));
 if(!free.length){S.iused=S.iused.filter(x=>!x.startsWith(kind));free=pool.map((_,i)=>i)}
 const i=pick(free);S.iused.push(kind+i);return i}

/* ================= 6단계: NBA 파이널 점수판 관전 =================
   점수판만 보여주는 화면(코트 애니메이션 없음). 시리즈 결과(승패·스코어)는 엔진의 po.series 를 그대로 쓰고,
   경기별 점수·쿼터·박스스코어는 그 결과와 모순되지 않게 생성한다. 이 기록은 시즌 누적 기록에는 더하지 않는다. */
const FN1=['마커스','데릭','트레이','카일','제일런','오마르','노아','이안','디앤드레','루카','소피안','탈','브랜든','자일스','엘리','케니','로니','다미안','호세','셰인'];
const FN2=['홀든','브룩스','웨스트레이','오카포','베넷','캘러웨이','그린우드','마르신','틸먼','어빙턴','라이트풋','스펜서','도슨','핸더슨','볼드윈','페어팩스','니콜슨','올리버','크로포드','와일더'];
function fnNames(n,used){const o=[];while(o.length<n){const s=pick(FN1)+' '+pick(FN2);if(!used.has(s)){used.add(s);o.push(s)}}return o}
function fnSplit(total,w){const sw=w.reduce((a,b)=>a+b,0),out=w.map(x=>Math.floor(total*x/sw));let rest=total-out.reduce((a,b)=>a+b,0);for(let i=0;rest>0;i=(i+1)%out.length){out[i]++;rest--}return out}
function fnQuarters(total){const q=[0,1,2,3].map(()=>Math.max(14,total/4+gauss()*3.2)),s=q.reduce((a,b)=>a+b,0),out=q.map(x=>Math.round(x*total/s));let d=total-out.reduce((a,b)=>a+b,0);for(let i=0;d!==0;i=(i+1)%4){const st=d>0?1:-1;out[i]+=st;d-=st}return out}
const fnClk=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const fnPer=p=>p<4?'Q'+(p+1):(p===4?'OT':(p-3)+'OT');

/* 한 경기의 쿼터별 점수. idx 0=내 팀, 1=상대 */
function fnScores(won,close){
 const ot=Math.random()<(close?.24:.1);let q0,q1;
 if(ot){const R=ri(90,112);q0=fnQuarters(R);q1=fnQuarters(R);
  let more=true,n=0;while(more){n++;const a=ri(8,14),b=ri(8,14);
   if(a===b&&n<3&&Math.random()<.5){q0.push(a);q1.push(b)}else{const d=ri(1,7),lo=ri(8,13);q0.push(won?lo+d:lo);q1.push(won?lo:lo+d);more=false}}}
 else{const m=close?ri(1,4):clamp(Math.round(Math.abs(gauss())*8)+1,1,26),W=ri(94,122),L=W-m;q0=fnQuarters(won?W:L);q1=fnQuarters(won?L:W)}
 return[q0,q1]}

/* 한 경기 전체(점수·박스스코어) 생성 */
function fnGame(S,r,n,won,close,hu,rost){
 const [q0,q1]=fnScores(won,close),t0=q0.reduce((a,b)=>a+b,0),t1=q1.reduce((a,b)=>a+b,0);
 let ln=null;for(let k=0;k<12;k++){const g=genGame(S,r.c,r.o);if(g.dnp)continue;if(g.pts<=t0*.55){ln=g;break}}
 let u;
 if(ln){u={n:S.name,u:1,min:ln.min,pts:ln.pts,reb:ln.reb,ast:ln.ast,stl:ln.stl,blk:ln.blk,fg:ln.fgm+'/'+ln.fga,tp:ln.tpm+'/'+ln.tpa,ft:ln.ftm+'/'+ln.fta,fgm:ln.fgm,tpm:ln.tpm,ftm:ln.ftm}}
 else u={n:S.name,u:1,dnp:1,min:0,pts:0,reb:0,ast:0,stl:0,blk:0,fg:'-',tp:'-',ft:'-',fgm:0,tpm:0,ftm:0};
 const mk=(names,total,ur,ua,fixed)=>{ // fixed: 첫 행(내 선수) 포함
  const pw=names.map((_,i)=>[22,18,15,12,9][i]*(.6+Math.random()*.8)).concat([10+Math.random()*8]);
  const pts=fnSplit(total-(fixed?fixed.pts:0),pw);
  const R=fnSplit(Math.max(ri(36,52),(fixed?fixed.reb:0)+8)-(fixed?fixed.reb:0),pw.map((x,i)=>i<names.length?x*.6+Math.random()*10:12));
  const A=fnSplit(Math.max(ri(18,31),(fixed?fixed.ast:0)+4)-(fixed?fixed.ast:0),pw.map(x=>x*.5+Math.random()*10));
  return names.map((nm,i)=>({n:nm,pts:pts[i],reb:R[i],ast:A[i]})).concat([{n:'벤치 합계',pts:pts[names.length],reb:R[names.length],ast:A[names.length]}])};
 const mine=mk(rost[0],t0,0,0,u),opp=mk(rost[1],t1);
 return{n,won,hu,q:[q0,q1],tot:[t0,t1],ot:q0.length-4,close:!!close,u,mine,opp}}

/* 경기 진행 재생용 득점 시퀀스: 쿼터 합과 정확히 일치한다 */
function fnSeq(g,S,clutch){
 const P=g.q[0].length,seq=[];
 const units=[];if(!g.u.dnp){for(let i=0;i<g.u.tpm;i++)units.push(3);for(let i=0;i<g.u.fgm-g.u.tpm;i++)units.push(2);for(let i=0;i<g.u.ftm;i++)units.push(1)}
 units.sort(()=>Math.random()-.5);
 const cap=g.q[0].slice(),au=cap.map(()=>[]);
 units.forEach(un=>{const c=cap.map((x,i)=>x>=un?x:0),s=c.reduce((a,b)=>a+b,0);let k=0;if(s>0){let z=Math.random()*s;for(;k<P-1&&z>=c[k];k++)z-=c[k]}else k=cap.indexOf(Math.max(...cap));au[k].push(un);cap[k]-=un});
 for(let p=0;p<P;p++){
  const plays=[];
  au[p].forEach(un=>plays.push({t:0,pts:un,u:1}));
  [0,1].forEach(t=>{let rem=g.q[t][p]-(t===0?au[p].reduce((a,b)=>a+b,0):0);while(rem>0){const v=rem>=3&&Math.random()<.22?3:rem>=2&&Math.random()<.8?2:1;plays.push({t,pts:v});rem-=v}});
  plays.sort(()=>Math.random()-.5);
  if(p===P-1&&clutch){const want=g.won?0:1;let k=-1;plays.forEach((pl,i)=>{if(pl.t===want)k=i});if(k>=0){const x=plays.splice(k,1)[0];x.clutch=1;plays.push(x)}}
  const len=p<4?720:300,n=plays.length,ts=plays.map(()=>Math.random()*len).sort((a,b)=>b-a);
  plays.forEach((pl,i)=>{pl.p=p;pl.clk=Math.floor(ts[i]);seq.push(pl)});
  if(p===P-1&&clutch&&seq.length){const l=seq[seq.length-1],pv=seq[seq.length-2];l.clk=Math.min(ri(2,8),pv&&!pv.end&&pv.p===l.p?pv.clk:99)}
  seq.push({end:1,p})}
 return seq}

function finalsScene(S,r){
 if(r.c.scale!=='nba'||!r.po||!r.po.made)return;
 const ls=r.po.series&&r.po.series[r.po.series.length-1];if(!ls||ls.lab!==LAB.nba[3])return;
 const m=/^(\d)-(\d)$/.exec(ls.score||'');if(!m)return;
 const my=+m[1],op=+m[2],total=my+op;
 const used=new Set([S.name]),rost=[fnNames(4,used),fnNames(5,used)];
 /* 마지막 경기가 시리즈를 결정한다. 클러치가 있었다면 접전으로 만든다 */
 const res=[];let a=my-(ls.won?1:0),b=op-(ls.won?0:1);
 for(let i=0;i<total-1;i++){const w=Math.random()<a/(a+b);res.push(w);w?a--:b--}
 res.push(!!ls.won);
 const hc=r.w>=48,homeSeq=[1,1,0,0,1,0,1];
 const games=res.map((w,i)=>fnGame(S,r,i+1,w,i===total-1&&!!r.clutch,hc?!!homeSeq[i]:!homeSeq[i],rost));
 const aw=(S.sum&&S.sum.aw)||[];
 queueScene(S,{type:'finals',fin:{opp:ls.opp,team:S.team.name,my,op,won:!!ls.won,champ:!!r.po.champ,fmvp:aw.includes('파이널 MVP'),clutch:r.clutch?{ok:!!r.clutch.success}:null,games,seed:Math.random()}})}

const FV={g:null,seq:null,i:0,st:null,tm:null,feed:[]};
function fnStop(){if(FV.tm){clearInterval(FV.tm);FV.tm=null}}
function fnBoard(f,g,st){
 const left=g.hu?1:0,right=g.hu?0:1,nm=[esc(f.team),esc(f.opp)],fin=st.done;
 const sc=st.sc,win=fin?(sc[0]>sc[1]?0:1):-1;
 const per=st.p<0?'경기 전':fin?(g.ot?(g.ot>1?g.ot+'OT':'OT')+' 종료':'종료'):fnPer(st.p);
 const P=g.q[0].length,cols=[];for(let p=0;p<P;p++)cols.push(p);
 const hd=cols.map(p=>`<td>${p<4?p+1:(p===4?'OT':(p-3)+'OT')}</td>`).join('');
 const row=t=>cols.map(p=>`<td>${st.qs[t][p]===undefined?'':st.qs[t][p]}</td>`).join('');
 return `<div class="fsb"><div class="frow"><div class="ftm ${win===left?'w':''}">${nm[left]}<small>${left===0?'내 팀':'상대'} · ${g.hu?'원정':'홈'}</small></div><div class="fmid"><div class="fper">${per}</div><div class="fclk">${st.p<0?'12:00':fin?'0:00':fnClk(st.clk)}</div></div><div class="ftm ${win===right?'w':''}">${nm[right]}<small>${right===0?'내 팀':'상대'} · ${g.hu?'홈':'원정'}</small></div></div>
 <div class="frow fscr"><div class="fpt ${win===left?'w':''}">${sc[left]}</div><div class="fdash">${fin?(g.ot?'FINAL/'+(g.ot>1?g.ot:'')+'OT':'FINAL'):'-'}</div><div class="fpt ${win===right?'w':''}">${sc[right]}</div></div>
 <table class="fqs"><tr><td></td>${hd}<td>T</td></tr><tr><td class="fn">${nm[left].slice(0,12)}</td>${row(left)}<td><b>${sc[left]}</b></td></tr><tr><td class="fn">${nm[right].slice(0,12)}</td>${row(right)}<td><b>${sc[right]}</b></td></tr></table></div>`}
function fnFeedHTML(){return FV.feed.length?`<div class="ffeed">${FV.feed.slice().reverse().map(x=>`<div>${x}</div>`).join('')}</div>`:''}
function fnPaint(f){
 const g=FV.g,el=document.getElementById('fboard');if(!el)return;
 el.innerHTML=fnBoard(f,g,FV.st);
 const fe=document.getElementById('ffeed');if(fe)fe.innerHTML=fnFeedHTML()}
function fnStep(f){
 const g=FV.g,st=FV.st,S=window.S;
 if(FV.i>=FV.seq.length){fnStop();st.done=1;FV.feed.push(`<b>경기 종료</b> ${f.team} ${g.tot[0]} : ${g.tot[1]} ${esc(f.opp)} — ${g.won?'승리':'패배'}`);fnPaint(f);fnAfter(f);return}
 const e=FV.seq[FV.i++];
 if(e.end){const p=e.p;st.qs[0][p]=g.q[0][p];st.qs[1][p]=g.q[1][p];st.clk=0;
  const last=p===g.q[0].length-1;

  fnPaint(f);return}
 st.p=e.p;st.clk=e.clk;
 const before=Math.sign(st.sc[0]-st.sc[1]);
 st.sc[e.t]+=e.pts;
 const pp=st.qs[e.t][e.p]||0;st.qs[e.t][e.p]=pp+e.pts;
 if(!st.qs[1-e.t][e.p])st.qs[1-e.t][e.p]=st.qs[1-e.t][e.p]||0;

 if(e.u){st.up=(st.up||0)+e.pts;FV.feed.push(`${fnPer(e.p)} ${fnClk(e.clk)} · <b>${esc(S.name)}</b> ${e.pts===3?'3점슛 성공':e.pts===2?'2점 득점':'자유투 성공'} (${st.up}점)`)}

 else if(before!==0&&after!==0&&before!==after)FV.feed.push(`${fnPer(e.p)} ${fnClk(e.clk)} · 리드 변경 ${st.sc[0]}-${st.sc[1]}`);
 else if(before===0&&after!==0&&(st.sc[0]+st.sc[1])>10&&Math.random()<.5)FV.feed.push(`${fnPer(e.p)} ${fnClk(e.clk)} · ${after>0?esc(f.team):esc(f.opp)} 리드`);
 if(FV.feed.length>80)FV.feed.shift();

/* ---- 시즌 결과가 왜 그렇게 나왔는지: 능력치·역할·부상으로 설명 (표시용, 결과를 바꾸지 않음) ---- */
function whyList(S,r){
 const a=r.avg,D=S.d,o=r.o,lv=r.c.level,rel=o-lv,out=[];
 if(a.g===0){const ij=(r.injs||[])[0];return[ij?`${ij.kind}으로 시즌 대부분을 뛰지 못했습니다.`:'이번 시즌에는 출전 기록이 없습니다.']}
 out.push(rel>=12?`OVR ${o}가 팀 수준(${lv})을 크게 웃돌아 평균 ${Math.round(a.min)}분 동안 팀의 중심으로 뛰었습니다.`:rel>=4?`OVR ${o}로 팀 수준(${lv})보다 앞서 평균 ${Math.round(a.min)}분을 소화했습니다.`:rel>=-6?`OVR ${o}는 팀 수준(${lv})과 비슷해 로테이션으로 평균 ${Math.round(a.min)}분 뛰었습니다.`:`OVR ${o}가 팀 수준(${lv})에 못 미쳐 출전 시간이 평균 ${Math.round(a.min)}분에 그쳤습니다.`);
 if(a.min<8){out.push('출전 시간이 짧아 슛 기회와 기록을 쌓기 어려웠습니다. 훈련으로 OVR을 올려 로테이션 진입을 노려야 합니다.');return out}
 const sc=['inside','mid','three'].sort((x,y)=>D[y]-D[x])[0];
 out.push(`주무기는 ${DN[sc]}(${Math.round(D[sc])}) — 야투 ${Math.round(a.fg*100)}%${a.tpa>=2?`, 3점 ${Math.round(a.tp*100)}%(경기당 ${f1(a.tpa)}회 시도)`:''}${a.fta>=3?`, 자유투 ${Math.round(a.ft*100)}%`:''}.`);
 const FX={ft:`자유투 ${Math.round(a.ft*100)}%`,pass:`어시스트 ${f1(a.ast)}`,handle:`턴오버 ${f1(a.tov)}`,oiq:`턴오버 ${f1(a.tov)}`,dreb:`리바운드 ${f1(a.reb)}`,oreb:`리바운드 ${f1(a.reb)}`,perD:`스틸 ${f1(a.stl)}`,steal:`스틸 ${f1(a.stl)}`,intD:`블록 ${f1(a.blk)}`,block:`블록 ${f1(a.blk)}`,speed:'돌파와 속공 기회',jump:'림 근처 마무리와 블록',strength:'골밑 몸싸움'};
 const w=Object.keys(FX).sort((x,y)=>D[x]-D[y])[0];
 if(D[w]<=48)out.push(`약점은 ${DN[w]}(${Math.round(D[w])}) — ${FX[w]}에 영향을 줬습니다.`);
 const prev=S.seasons[S.seasons.length-2];
 if(prev&&prev.g>10&&prev.stage===r.stage){const dp=a.pts-prev.pts,dm=a.min-prev.min,dO=o-prev.ovr;
  if(Math.abs(dp)>=2){const why=[];if(Math.abs(dm)>=3)why.push(`출전 시간 ${dm>0?'증가':'감소'}(${dm>0?'+':''}${Math.round(dm)}분)`);if(Math.abs(dO)>=2)why.push(`OVR ${dO>0?'+':''}${dO}`);
   out.push(`전 시즌 대비 득점 ${dp>0?'+':''}${f1(dp)}점${why.length?' — '+why.join(', ')+'의 영향':''}.`)}}
 const lost=(r.injs||[]).reduce((s,k)=>s+k.games,0);if(lost>=10)out.push(`부상으로 ${lost}경기를 쉬어 시즌 기록이 줄었습니다.`);
 return out.slice(0,4)}
function whyBlock(u){return u&&u.why&&u.why.length?`<h3>이번 시즌, 왜 이런 결과?</h3><div class="why">${u.why.map(x=>`<p>• ${x}</p>`).join('')}</div>`:''}

function feedPush(S,y,age,src,t){S.feed=S.feed||[];S.feed.push({y,age,src,t});if(S.feed.length>200)S.feed.shift()}

 aw.forEach(x=>{if(x==='MVP'||/올-NBA|올해의|식스맨|올스타 MVP|파이널 MVP|기량/.test(x))feedPush(S,y,r.age,'수상',`${S.name}, ${x} 수상`)});
 feedPush(S,y,r.age,'시즌',`${r.team} ${r.w}승 ${r.l}패 · ${r.po.result}`)}

 S.feed=[];let ny=0;(S.seasons||[]).forEach(s=>{const y=s.stage==='nba'?`NBA ${++ny}년차 · ${s.team}`:s.label;

 S.feed=S.feed.slice(-200)}

 const F=(S.feed||[]).slice().reverse();
 return `<p class="muted">시즌마다 쌓이는 이 선수의 뉴스입니다. 최근 순으로 최대 200건 보관합니다.</p>`+(F.length?F.slice(0,60).map(n=>`<div class="lower"><i>${esc(n.src)}</i><span>${esc(n.t)}<small>${esc(n.y)} · ${n.age}세</small></span></div>`).join(''):'<p class="muted">아직 뉴스가 없습니다.</p>')}

/* ---- 명예의 전당 투표 (은퇴 시 한 번 결정되어 저장) ---- */
const HOFSP=['처음 농구공을 잡았던 체육관을 떠올립니다. 이 자리에 설 수 있게 해 준 모든 분들께 감사드립니다.','기록은 숫자일 뿐이고, 기억에 남는 건 함께 뛴 사람들입니다. 동료와 코치, 가족에게 이 영광을 돌립니다.','어린 시절 골대에 낙서하던 아이가 이곳에 서 있습니다. 포기하지 않아서 가능했습니다.','우승 반지보다 소중한 건 함께한 시간입니다. 팬 여러분, 감사합니다.'];
function hofBallot(S){
 if(S.hof)return S.hof;
 if(!(S.ct.nbaYears>0))return null;
 const h=hofScore(S);let b={h,ind:false,first:false,wait:0,pct:0,hist:[]};
 if(h>=60){b.ind=true;b.first=true;b.pct=Math.round(clamp(88+(h-60)*.25+gauss()*2,86,99.5)*10)/10;b.hist=[b.pct]}
 else if(h>=35){b.ind=true;b.wait=ri(1,4);let p=clamp(52+(h-35)*.8+gauss()*5,40,72);for(let i=0;i<=b.wait;i++){b.hist.push(Math.round(Math.min(i===b.wait?clamp(76+gauss()*3,75.5,86):p+i*(75.5-p)/(b.wait+1),99)*10)/10)}b.pct=b.hist[b.hist.length-1]}
 else if(h>=20){b.pct=Math.round(clamp(8+(h-20)*1.6+gauss()*4,3,44)*10)/10;b.hist=[b.pct]}
 else return S.hof=null;
 b.sp=pick(HOFSP);S.hof=b;return b}

const BRREN={VANTOR:'VELOZ',AERION:'ARCLYN',FORTRIX:'TITANOR',ORVEX:'WARDEN',NEXORA:'MAESTRO',RAVENIX:'SKYRIDE'};
function fixBrands(o,d){if(!o||typeof o!=='object'||(d||0)>8)return;for(const k in o){const v=o[k];if(k==='brand'&&typeof v==='string'&&BRREN[v])o[k]=BRREN[v];else if(v&&typeof v==='object')fixBrands(v,(d||0)+1)}}
function migrateSave5(S){fixBrands(S.shoes);fixBrands(S.evt);fixBrands(S.cur);delete S.rival;if(S.flags)delete S.flags.beatRival;if(S.dn){S.dn.rivalPick=0}if(S.feed)S.feed=S.feed.filter(f=>!/라이벌/.test(f.t||f.text||''));if(S.sum&&Array.isArray(S.sum.news))S.sum.news=S.sum.news.filter(n=>!/라이벌/.test(n.t||''))}

/* ================= v2 드래프트 화면: 컴바인 → 팀 워크아웃 → 스카우트 보고서 ================= */
const fmtIn=v=>{const t=Math.round(v*10)/10;return Math.floor(t/12)+"'"+(Math.round((t%12)*10)/10)+'"'};
function cbVal(g,key,v){
 if(g==='body'){if(key==='wt')return Math.round(v)+'lb ('+Math.round(v*.4536)+'kg)';return fmtIn(v)+' ('+Math.round(v*2.54)+'cm)'}
 if(g==='ath'){if(key==='sprint'||key==='agil')return v.toFixed(2)+'초';return v.toFixed(1)+'in'}
 return Math.round(v)+'점'}
function cbBlock(S,g,title){
 const cb=S.combine;
 return `<h3>${title}</h3>`+CB_ROWS[g].map(([k,n])=>{const p=cb.pct[k],top=Math.max(1,100-p);
  return `<div class="bar" style="grid-template-columns:128px 1fr 150px"><span>${n}</span><div class="t"><div class="f" style="width:${p}%"></div></div><span class="v" style="text-align:right">${cbVal(g,k,cb[g][k])} <span class="muted">상위 ${top}%</span></span></div>`}).join('')}
function combineNotes(S){
 const c=S.combine,n=[];

/* ================= v7 NBA 현실형 계약 시스템 =================

 const c=S.ct||{};if(ext&&(c.allnba>=2||c.mvp>=1||c.dpoy>=1))p=Math.max(p,.30);
 if(s>=7&&(c.allnba>=3||c.mvp>=1))p=.35;return p}
const vetMin=S=>{const s=svcOf(S);return r2(capOf(S)*(s===0?.0085:s<=2?.011:s<=4?.0135:.0165))};
const mleOf=S=>r2(capOf(S)*.087);
const KINDN={rookie:'루키 스케일 계약',rookie2:'2라운드 계약',bird:'재계약 (버드 권리)',cap:'캡 스페이스 계약',mle:'미드 레벨 예외 (MLE)',min:'베테랑 미니멈',ext:'연장 계약',glg:'G리그 계약',legacy:'계약',call:'NBA 계약'};
function mvPct(o){const t=[[45,.0075],[55,.011],[60,.018],[65,.035],[70,.07],[75,.135],[80,.215],[85,.29],[90,.34],[99,.38]];
 if(o<=t[0][0])return t[0][1];for(let i=1;i<t.length;i++)if(o<=t[i][0]){const[a,b]=t[i-1],[c,d]=t[i];return b+(d-b)*(o-a)/(c-a)}return .38}

 p*=S.age>=34?.6:S.age>=32?.78:S.age>=30?.9:(S.age<=24&&S.pot>o+3)?1.05:1;

function firstYr(a,yrs,R){let sum=0;for(let i=0;i<yrs;i++)sum+=1+R*i;return a*yrs/sum}

  let s0=firstYr(of.aav*mul,yrs,R);s0=Math.min(s0,mx);const o={};if(opt)o[yrs-1]='player';
  const c=mkC({kind:of.kind,yrs,s0,raise:R,opts:o,rfa:false});v.push({yrs,s0:r2(s0),raise:R,opts:o,label,total:c.total,aav:r2(c.total/yrs),first:c.sals[0]})};

 let team=of.team,T=of.T,matched=false;const old=S.contract;
 if(mode==='fa'&&!of.own&&old&&old.rfa&&!old.early&&old.kind==='rookie'){

  S.contract={kind:'ext',yrs:1+v.yrs,n:1+v.yrs,i:0,sal:cur.sal,sals:[cur.sal].concat(cs.sals),opts:Object.fromEntries(Object.entries(cs.opts).map(([k,x])=>[+k+1,x])),pick:cur.pick,rfa:false,total:r2(cur.sal+cs.total)};

  S.team={name:team,T};S.contract=mkC({kind:matched?'bird':kind,yrs:v.yrs,s0:v.s0,raise:v.raise,opts:v.opts});

 S.offers=null;S.cmode=null;S.mktAdj=0;
 const c=S.contract,big=c.total>=capOf(S)*.1||mode==='ext'||of.own;
 const msg=matched?`${of.team}의 제안을 ${S.team.name}이(가) 그대로 매치했습니다. ${S.team.name}에 남습니다.`:null;

 runScenes(S)};

/* --- 선택 & 시점 --- */
function pickEvent(S,slots){
 S.evtHist=S.evtHist||[];
 const base=EVENTS.filter(e=>e.when(S)&&(!slots||slots.includes(e.at||'post')));
 let ok=base.filter(e=>!S.evtHist.includes(e.id));
 if(!ok.length)ok=base.filter(e=>e.id!==S.lastEvt);
 if(!ok.length)return null;
 const e=pick(ok);S.lastEvt=e.id;S.evtHist.push(e.id);if(S.evtHist.length>10)S.evtHist.shift();return e}
function pickMidEvent(S){
 if(S.stage==='retired')return null;
 const p=S.stage==='hs'?.35:.4;if(Math.random()>=p)return null;
 return pickEvent(S,['mid'])}
/* 프리시즌: 미디어데이(NBA) → 시즌 전 이벤트 → 시즌 시작 */
function preSeason(){
 const S=window.S,n=S.seasons.length;S.ivLast=S.ivLast||{};
 if(S.stage==='nba'){
  const cy=S.contract&&S.contract.yrs===1,kind=cy?'mediaCY':'media';
  if((cy||Math.random()<.5)&&(S.ivLast[kind]===undefined||n-S.ivLast[kind]>=2)){S.ivLast[kind]=n;queueScene(S,{type:'interview',kind})}}
 const e=Math.random()<.32?pickEvent(S,['pre']):null;
 if(e){S.evt={id:e.id,done:false,next:'season'};S.sceneNext='event'}else S.sceneNext='season';
 runScenes(S)}
acts.startSeason=()=>preSeason();
/* ================= 파이널 라이브: '파이널 시작' → 경기별 실시간 박스스코어 + 결정적 순간 선택 =================
   시리즈 결과(경기 승패·점수)는 시즌 시뮬레이션에서 이미 정해져 있다(챔피언·수상 기록과 모순되면 안 되므로).
   이 화면에서 달라지는 것: 내 선수의 득점 기여(누가 득점했는지)·기록, 평판(팬·이미지·명성). 팀 점수는 바뀌지 않는다.
   모든 득점은 선수에게 귀속되며 박스스코어 합계 = 팀 점수가 항상 맞는다. */
const LV={g:null,f:null,seq:null,mom:[],U:null,rows:null,cur:null,auto:0,wait:0,res:null};

/* ---------- 확률 ---------- */
function mProb(S,k,late){
 const a=S.a||{},g=x=>a[x]||40;
 const raw={
  s3:.10+g('shoot')*.0050+g('iq')*.0006,
  s3c:.12+g('shoot')*.0046+g('iq')*.0014,
  mid:.14+(g('shoot')*.62+g('handle')*.28+g('iq')*.10)*.0058,
  drive:.20+(g('finish')*.5+g('athletic')*.3+g('handle')*.2)*.0062,
  dunk:.08+(g('athletic')*.6+g('finish')*.4)*.0078,
  post:.20+(g('finish')*.55+g('athletic')*.25+g('rebound')*.2)*.0060,
  pass:.30+(g('pass')*.55+g('iq')*.45)*.0058}[k];
 return clamp(raw*(late&&k!=='pass'?.93:1),.12,.88)}
const MOPT={
 3:[['s3','스텝백 3점슛','수비를 떨쳐내고 직접 던진다. 성공하면 내 득점.'],['s3c','코너로 빠져 캐치앤슛','공을 받아 바로 던진다. 안정적인 편.'],['pass','킥아웃 패스','동료에게 준다. 성공하면 어시스트.']],
 2:[['drive','돌파 후 레이업','림까지 파고든다. 몸싸움을 이겨야 한다.'],['mid','풀업 미드레인지','한 박자 빠른 중거리 슛.'],['pass','컷인하는 동료에게 패스','성공하면 어시스트.']],
 fast:[['drive','레이업으로 마무리','가장 확실한 선택.'],['dunk','윈드밀 덩크','성공하면 분위기가 뒤집힌다.'],['pass','트레일러에게 패스','성공하면 어시스트.']]};
const MK={
 fast:{t:'속공 기회',x:(c,f)=>`${f.opp}의 턴오버! 눈앞에 빈 코트가 펼쳐진다.`},
 iso:{t:'아이솔레이션',x:()=>`샷클락이 줄어든다. 공이 내게 왔다.`},
 run:{t:'흐름 끊기',x:(c,f)=>`${f.opp}가 연속 득점으로 분위기를 가져갔다. 타임아웃 직후 첫 공격.`},
 late:{t:'승부처',x:()=>`경기가 막바지로 향한다. 작전은 내게 맡겨졌다.`},
 buzzer:{t:'버저비터',x:()=>`남은 시간은 몇 초. 마지막 공격, 공은 내 손에 있다.`}};
function lvOpts(m,play){const list=m.kind==='fast'&&play.pts===2?MOPT.fast:MOPT[play.pts===3?3:2];return list.map(o=>({k:o[0],l:o[1],d:o[2]}))}

/* ---------- 경기 구성 ---------- */
function lvBuild(g,f,S){
 sync(S);
 const margin=Math.abs(g.tot[0]-g.tot[1]),close=margin<=5||g.ot>0;
 const seq=fnSeq(g,S,close);
 const wMine=[22,18,15,12,10],wOpp=[22,18,15,12,9,10];
 const pickW=w=>{let z=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){z-=w[i];if(z<0)return i}return w.length-1};
 seq.forEach(e=>{if(e.end)return;e.who=e.t===0?(e.u?-1:pickW(wMine)):pickW(wOpp)});
 /* 결정적 순간 선택 */
 const moms=[];
 if(!g.u.dnp){
  const cand=[];seq.forEach((e,i)=>{if(!e.end&&e.t===0&&e.pts>=2)cand.push(i)});
  const lastP=g.q[0].length-1,lastIdx=(()=>{for(let i=seq.length-1;i>=0;i--)if(!seq[i].end)return i;return -1})();
  let lateI=-1;for(let k=cand.length-1;k>=0;k--){if(seq[cand[k]].p===lastP){lateI=cand[k];break}}
  if(close&&lateI>=0){const e=seq[lateI];moms.push({idx:lateI,kind:(g.won&&lateI===lastIdx&&e.clk<=10)?'buzzer':'late'})}
  const n=close?2:(Math.random()<.5?2:1);
  const pool=cand.filter(i=>seq[i].p>=1&&(g.q[0].length<5?seq[i].p<=3:true)&&i!==lateI);
  for(let t=0,k=0;k<n&&t<60&&pool.length;t++){
   const i=pool[ri(0,pool.length-1)];
   if(moms.some(m=>Math.abs(m.idx-i)<30))continue;
   const e=seq[i],sc=[0,0];
   const kind=['fast','iso','run'][ri(0,2)];
   moms.push({idx:i,kind:e.pts===3&&kind==='fast'?'iso':kind});k++}
  moms.sort((a,b)=>a.idx-b.idx)}
 return{seq,moms}}

function lvInit(g,f,S){
 const b=lvBuild(g,f,S);
 LV.g=g;LV.f=f;LV.seq=b.seq;LV.mom=b.moms;LV.cur=null;LV.res=null;LV.wait=0;
 const u0=g.u,P=s=>{const m=/^(\d+)\/(\d+)$/.exec(s||'');return m?[+m[1],+m[2]]:[0,0]};
 const fg=P(u0.fg),tp=P(u0.tp),ft=P(u0.ft);
 LV.U={n:S.name,min:u0.min,reb:u0.reb,ast:u0.ast,stl:u0.stl,blk:u0.blk,pts:0,fgm:0,tpm:0,ftm:0,
  missFG:Math.max(0,fg[1]-fg[0]),missTP:Math.max(0,tp[1]-tp[0]),missFT:Math.max(0,ft[1]-ft[0]),astAdd:0,tovAdd:0,dnp:!!u0.dnp,log:[]};
 LV.rows=[g.mine.map(x=>({n:x.n,pts:0,reb:x.reb,ast:x.ast})),g.opp.map(x=>({n:x.n,pts:0,reb:x.reb,ast:x.ast}))];
 LV.orig=JSON.stringify([g.mine,g.opp,g.u])}

/* ---------- 라이브 박스스코어 ---------- */
function lvProg(){return LV.seq.length?Math.min(1,FV.i/LV.seq.length):1}
function lvLine(){const U=LV.U,pr=FV.st.done?1:lvProg(),w=(x)=>Math.floor(x*pr+1e-9);
 const fga=U.fgm+Math.floor(U.missFG*pr),tpa=U.tpm+Math.floor(U.missTP*pr),fta=U.ftm+Math.floor(U.missFT*pr);
 return{min:U.dnp?0:Math.round(U.min*pr),pts:U.pts,reb:w(U.reb),ast:w(U.ast)+U.astAdd,stl:w(U.stl),blk:w(U.blk),fg:U.fgm+'/'+fga,tp:U.tpm+'/'+tpa,ft:U.ftm+'/'+fta}}
function lvBox(){
 const pr=FV.st.done?1:lvProg(),w=x=>Math.floor(x*pr+1e-9),L=lvLine(),f=LV.f;
 const tbl=(nm,rows,isMine)=>{
  const body=(isMine?[`<tr class="me"><td>${esc(S_().name)}</td><td>${L.min}</td><td>${L.pts}</td><td>${L.reb}</td><td>${L.ast}</td></tr>`]:[]).concat(
   rows.map(x=>`<tr><td>${esc(x.n)}</td><td></td><td>${x.pts}</td><td>${w(x.reb)}</td><td>${w(x.ast)}</td></tr>`)).join('');
  const tp=rows.reduce((a,x)=>a+x.pts,0)+(isMine?L.pts:0),tr=rows.reduce((a,x)=>a+w(x.reb),0)+(isMine?L.reb:0),ta=rows.reduce((a,x)=>a+w(x.ast),0)+(isMine?L.ast:0);
  return `<table class="fbx lv"><tr><th>${esc(nm)}</th><th>분</th><th>득점</th><th>리바</th><th>어시</th></tr>${body}<tr class="tt"><td>합계</td><td></td><td>${tp}</td><td>${tr}</td><td>${ta}</td></tr></table>`};
 return `${tbl(f.team,LV.rows[0],true)}<p class="sm fuline"><b>${esc(S_().name)}</b> FG ${L.fg} · 3P ${L.tp} · FT ${L.ft} · 스틸 ${L.stl} · 블록 ${L.blk}${LV.U.dnp?' · 이 경기는 결장':''}</p>${tbl(f.opp,LV.rows[1],false)}`}
function lvPaint(f){
 const el=document.getElementById('fboard');if(!el)return;
 el.innerHTML=fnBoard(f,LV.g,FV.st);
 const lb=document.getElementById('flive');if(lb)lb.innerHTML=lvBox();
 const fe=document.getElementById('ffeed');if(fe)fe.innerHTML=fnFeedHTML()}

/* ---------- 진행 ---------- */
function lvTick(f){
 if(LV.wait)return;
 const g=LV.g,st=FV.st,S=window.S;
 const m=LV.mom.find(x=>x.idx===FV.i&&!x.done);
 if(m){lvMoment(m,f);return}
 if(FV.i>=LV.seq.length){lvEnd(f);return}
 const e=LV.seq[FV.i++];
 if(e.end){const p=e.p;st.qs[0][p]=g.q[0][p];st.qs[1][p]=g.q[1][p];st.clk=0;
  const last=p===g.q[0].length-1;
  FV.feed.push(`<span class="muted">${fnPer(p)} 종료 · ${st.sc[0]}-${st.sc[1]}</span>`+(!last&&p>=3&&st.sc[0]===st.sc[1]?' (동점, 연장)':''));
  lvPaint(f);return}
 st.p=e.p;st.clk=e.clk;
 const before=Math.sign(st.sc[0]-st.sc[1]);
 st.sc[e.t]+=e.pts;st.qs[e.t][e.p]=(st.qs[e.t][e.p]||0)+e.pts;if(st.qs[1-e.t][e.p]===undefined)st.qs[1-e.t][e.p]=0;
 const after=Math.sign(st.sc[0]-st.sc[1]);
 const U=LV.U;
 if(e.t===0&&e.u){U.pts+=e.pts;if(e.pts===3){U.tpm++;U.fgm++}else if(e.pts===2)U.fgm++;else U.ftm++;
  if(!e.mom)FV.feed.push(`${fnPer(e.p)} ${fnClk(e.clk)} · <b>${esc(S.name)}</b> ${e.pts===3?'3점슛 성공':e.pts===2?'2점 득점':'자유투 성공'} (${U.pts}점)`)}
 else if(e.t===0){LV.rows[0][e.who].pts+=e.pts}
 else LV.rows[1][e.who].pts+=e.pts;
 if(e.mom){/* 선택 결과 문구는 이미 피드에 있음 */}
 else if(e.clutch)FV.feed.push(`<b>${fnPer(e.p)} ${fnClk(e.clk)} · ${e.t===0?'마지막 득점! 승부를 가르는 순간':'상대의 마지막 득점으로 승부가 갈렸다'}</b>`);
 else if(before!==0&&after!==0&&before!==after)FV.feed.push(`${fnPer(e.p)} ${fnClk(e.clk)} · 리드 변경 ${st.sc[0]}-${st.sc[1]}`);

function lvMoment(m,f){

 /* 자동(건너뛰기/속도 0)이면 가장 높은 확률을 고른다 */
 if(LV.auto||CFG.speed===0){let b=0;m.opts.forEach((o,i)=>{if(o.p>m.opts[b].p)b=i});lvResolve(m,b,f,true);return}

function lvResolve(m,i,f,auto){
 const S=window.S,e=LV.seq[m.idx],o=m.opts[i],U=LV.U,st=FV.st,late=m.kind==='late'||m.kind==='buzzer';
 const ok=Math.random()*100<o.p;m.done=1;m.pick=o.l;m.ok=ok;m.p=o.p;m.auto=!!auto;m.kindN=MK[m.kind].t;m.at=fnPer(e.p)+' '+fnClk(e.clk);
 e.mom=1;const shot=o.k!=='pass',per=fnPer(e.p),clk=fnClk(e.clk);
 let line;
 if(shot){
  if(ok){e.u=1;e.who=-1;
   line=m.kind==='buzzer'?`<b>${per} ${clk} · 버저비터!!</b> ${esc(S.name)}의 ${o.l}이(가) 림을 가른다! ${e.pts}점!`
    :`<b>${per} ${clk} · ${o.l} 성공!</b> ${esc(S.name)}가 ${e.pts}점을 올린다.`;}
  else{e.u=0;e.who=weightedMate();
   if(e.pts===3)U.missTP++;U.missFG++;
   const mate=LV.rows[0][e.who].n;
   line=`${per} ${clk} · ${o.l}… 빗나갔다! 그러나 ${esc(mate)}이(가) 리바운드를 잡아 ${e.pts}점으로 연결한다.`}}
 else{
  e.u=0;e.who=weightedMate();
  const mate=LV.rows[0][e.who].n;
  if(ok){U.astAdd++;line=`${per} ${clk} · 완벽한 패스! ${esc(mate)}의 ${e.pts}점 득점, ${esc(S.name)}의 어시스트.`}
  else{U.tovAdd++;line=`${per} ${clk} · 패스가 흐르며 흐름이 끊겼지만 ${esc(mate)}이(가) 공을 되찾아 ${e.pts}점을 만든다.`}}
 FV.feed.push(line);
 /* 이 시점부터 같은 득점 플레이는 일반 재생으로 처리(점수는 그대로) */
 LV.wait=0;LV.cur=null;
 const el=document.getElementById('fmom');
 if(el&&!auto){const msg=ok?(shot?'성공!':'성공! 어시스트 기록'):(shot?'실패':'실패 — 패스 미스');
  el.innerHTML=`<div class="fmom res ${ok?'ok':'no'}"><b>${esc(o.l)} · ${msg}</b><span class="muted"> (확률 ${o.p}%)</span></div>`;
  setTimeout(()=>{const x=document.getElementById('fmom');if(x&&!LV.wait)x.innerHTML=''},1400)}
 if(!auto&&!LV.auto&&CFG.speed!==0)FV.tm=setInterval(()=>lvTick(f),Math.max(8,38/(CFG.speed||1)))}
function weightedMate(){const w=[22,18,15,12,10];let z=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){z-=w[i];if(z<0)return i}return 4}
